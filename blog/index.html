<script>
/* Render the post list from posts.js */
(function () {
  var posts = window.BLOG_POSTS || [];
  var container = document.getElementById('posts');
  if (!posts.length) return;
  container.innerHTML = '';
  var frag = document.createDocumentFragment();
  posts.forEach(function (p, i) {
    var card = document.createElement('a');
    card.className = 'post-card reveal';
    card.href = 'post.html?id=' + encodeURIComponent(p.id);
    var date = new Date(p.date);
    var dateStr = isNaN(date) ? p.date : date.toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
    card.innerHTML =
      '<span class="post-tag">' + (p.tag || 'Update') + '</span>' +
      '<h2>' + p.title + '</h2>' +
      '<p class="post-date">' + dateStr + '</p>' +
      '<p class="post-excerpt">' + (p.excerpt || '') + '</p>' +
      '<span class="post-more">Read →</span>';
    frag.appendChild(card);
  });
  container.appendChild(frag);

  /* reveal the cards shortly after paint */
  setTimeout(function () {
    Array.prototype.forEach.call(container.querySelectorAll('.reveal'), function (el, i) {
      setTimeout(function () { el.classList.add('visible'); }, i * 80);
    });
  }, 100);
})();
</script>
