<script>
/* Render the single post based on ?id= */
(function () {
  var id = new URLSearchParams(window.location.search).get('id');
  var posts = window.BLOG_POSTS || [];
  var post = posts.filter(function (p) { return p.id === id; })[0];
  var content = document.getElementById('postContent');
  if (!post) {
    document.title = 'Post not found — Isak Žvegelj';
    document.getElementById('postTitle').textContent = 'Post not found';
    content.innerHTML = '<p>Sorry, that article doesn\'t exist. <a href="index.html">Back to the blog.</a></p>';
    return;
  }
  document.title = post.title + ' — Isak Žvegelj';
  var date = new Date(post.date);
  var dateStr = isNaN(date) ? post.date : date.toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('postTag').textContent = post.tag || 'Update';
  document.getElementById('postTitle').textContent = post.title;
  document.getElementById('postDate').textContent = dateStr;
  document.getElementById('postContent').innerHTML = post.content || '';
})();
</script>
