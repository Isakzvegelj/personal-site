    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>

<main class="page-wrap">
  <article class="page-hero post-hero">
    <div class="container">
      <p class="back-link"><a href="index.html">← Back to blog</a></p>

      <h1 id="postTitle"></h1>
      <p class="post-date" id="postDate"></p>
    </div>
  </article>

  <section class="section post-body">
    <div class="container">
      <div id="postContent" class="prose"></div>
      <p class="back-link bottom"><a href="index.html">← More articles</a></p>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© <span id="year"></span> Isak Žvegelj. All rights reserved.</p>
      <p>Built with discipline. 🚣</p>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
<script src="posts.js"></script>
<script>
/* Render the single post based on ?id= */
(function () {
  var id = new URLSearchParams(window.location.search).get('id');
  var posts = window.BLOG_POSTS || [];
  var post = posts.filter(function (p) { return p.id === id; })[0];
  var content = document.getElementById('postContent');
  if (!post) {
    document.title = 'Post not found — Isak Žvegelj';
    document.getElementById('postTitle').textContent = 'Post not found';
    content.innerHTML = '<p>Sorry, that article doesn\'t exist. <a href="index.html">Back to the blog.</a></p>';
    return;
  }
  document.title = post.title + ' — Isak Žvegelj';
  var date = new Date(post.date);
  var dateStr = isNaN(date) ? post.date : date.toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('postTag').textContent = post.tag || 'Update';
  document.getElementById('postTitle').textContent = post.title;
  document.getElementById('postDate').textContent = dateStr;
  document.getElementById('postContent').innerHTML = post.content || '';
})();
</script>
</body>
</html>
