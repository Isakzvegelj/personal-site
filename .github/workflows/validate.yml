name: Validate static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate HTML and local references
        run: python3 tools/validate_site.py
      - name: Run publisher tests
        run: python3 blog/test_publish.py
      - name: Compile Python tools
        run: python3 -m py_compile blog/publish.py blog/test_publish.py tools/gsc.py tools/validate_site.py
